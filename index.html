<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>俄羅斯方塊｜五關冒險</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><h1>🧱 俄羅斯方塊</h1><p id="theme">第一關・星空啟程</p></header>
<main>
<section class="board"><canvas id="game" width="300" height="600"></canvas><div id="msg" class="hidden"></div></section>
<aside>
<div class="card">
<h2>🎮 遊戲資訊</h2>
<div>關卡 <b id="level">1 / 5</b></div>
<div>分數 <b id="score">0</b></div>
<div>消除行數 <b id="lines">0</b></div>
<div>最高分 <b id="high">0</b></div>
</div>
<div class="card next"><h2>下一個</h2><canvas id="next" width="120" height="120"></canvas></div>
<button id="start">開始新遊戲</button>
</aside>
</main>
<div class="controls">
<button data-a="left">◀</button><button data-a="rotate">↻</button><button data-a="right">▶</button>
<button data-a="down">▼ 加速</button><button data-a="drop">⬇ 直接落下</button><button data-a="pause">Ⅱ 暫停</button>
</div>
<footer>📱 手機直接點擊按鈕即可操作</footer>
</div>
<script src="script.js"></script>
</body>
</html>
